<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер досрочных платежей</title>
<style>
:root {
  --bg: #F4F5F0;
  --surface: #FFFFFF;
  --field: #F7F9F4;
  --ink: #182B29;
  --muted: #73807A;
  --line: #E4E9E1;
  --line-strong: #CDD6C8;
  --brand: #2F5E3F;
  --brand-ink: #FFFFFF;
  --brand-soft: #EDF4E4;
  --pos: #3E7A35;
  --pos-soft: #EEF6E2;
  --pos-line: #A6C38F;
  --neg: #A8664F;
  --sky: #B7C6B2;
  --c-old: #D2DACB;
  --c-int: #C99A7E;
  --c-new: #4E7D3A;
  --c-area: rgba(110, 160, 80, 0.16);
  --extra-bg: #FAFEF2;
  --extra-line: #DCE7CE;
  --warn: #8C6122;
  --warn-bg: #FFF1D9;
  --hero-bg: #1C302C;
  --hero-ink: #FFFFFF;
  --hero-muted: #A9BBA2;
  --hero-line: rgba(173, 203, 155, 0.16);
  --lime: #D4F77C;
  --lime-ink: #233A1B;
  --seg-bg: #EFF3EA;
  --quick-line: #D6E2C8;
  --quick-ink: #5E7550;
  --ico-bg: #F2F5EE;
  --ico-ink: #6B805C;
  --ico-on-bg: #DAE9C8;
  --ico-on-ink: #456333;
  --soft-ink: #6B7D69;
  --accent-text: #73876A;
  --bad: #9A3B2B; --bad-bg: #FBE9E4;
  --font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1715; --surface: #16211E; --field: #121B19; --ink: #E4ECE5; --muted: #93A39A;
    --line: #24322E; --line-strong: #34453F; --brand: #A9D39A; --brand-ink: #10201A; --brand-soft: rgba(169, 211, 154, 0.12);
    --pos: #BFE38E; --pos-soft: rgba(212, 247, 124, 0.08); --pos-line: #5E7F4B; --neg: #D9A08A; --bad: #F0A898; --bad-bg: #3A1F1A;
    --sky: #5A7264; --c-old: #3B4B45; --c-int: #B98A70; --c-new: #BFE38E; --c-area: rgba(191, 227, 142, 0.12);
    --extra-bg: #17241C; --extra-line: #2C3D2F; --warn: #E8C27A; --warn-bg: #33291A;
    --hero-bg: #1C302C; --seg-bg: #1D2A26; --quick-line: #34453F; --quick-ink: #B5CCA5; --ico-bg: #1D2A26; --ico-ink: #A9C29A; --ico-on-bg: #2F4630; --ico-on-ink: #D4F77C; --soft-ink: #8FA28C; --accent-text: #9DB491; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1715; --surface: #16211E; --field: #121B19; --ink: #E4ECE5; --muted: #93A39A;
  --line: #24322E; --line-strong: #34453F; --brand: #A9D39A; --brand-ink: #10201A; --brand-soft: rgba(169, 211, 154, 0.12);
  --pos: #BFE38E; --pos-soft: rgba(212, 247, 124, 0.08); --pos-line: #5E7F4B; --neg: #D9A08A; --bad: #F0A898; --bad-bg: #3A1F1A;
  --sky: #5A7264; --c-old: #3B4B45; --c-int: #B98A70; --c-new: #BFE38E; --c-area: rgba(191, 227, 142, 0.12);
  --extra-bg: #17241C; --extra-line: #2C3D2F; --warn: #E8C27A; --warn-bg: #33291A;
  --hero-bg: #1C302C; --seg-bg: #1D2A26; --quick-line: #34453F; --quick-ink: #B5CCA5; --ico-bg: #1D2A26; --ico-ink: #A9C29A; --ico-on-bg: #2F4630; --ico-on-ink: #D4F77C; --soft-ink: #8FA28C; --accent-text: #9DB491; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; padding:8px 16px 48px; }
button { font:inherit; color:inherit; }
.wrap { max-width:1280px; margin:0 auto; }
.top { height:72px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; letter-spacing:-0.02em; }
.mark { width:36px; height:36px; border-radius:11px; background:var(--hero-bg); color:var(--lime); display:grid; place-items:center; }
.mark svg { display:block; }
.head-right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.theme-btn { display:flex; align-items:center; gap:8px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); border-radius:999px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer; }
.theme-btn:hover { background:var(--surface); }
.theme-btn .i-sun { display:none; }
.theme-btn[aria-pressed="true"] .i-sun { display:block; }
.theme-btn[aria-pressed="true"] .i-moon { display:none; }
.hello { padding:26px 0 20px; }
.eyebrow { text-transform:uppercase; letter-spacing:.14em; font-size:13px; font-weight:700; color:var(--soft-ink); margin:0 0 10px; }
h1 { font-size:clamp(28px,4.4vw,44px); font-weight:600; line-height:1.06; letter-spacing:-0.04em; margin:0; text-wrap:balance; }
h1 span { color:var(--accent-text); }
.sub { color:var(--muted); font-size:15.5px; line-height:1.6; margin-top:10px; max-width:720px; }
.badge { font-size:13px; font-weight:600; padding:5px 12px; border-radius:999px; background:var(--brand-soft); color:var(--brand); white-space:nowrap; }
.badge.warn { background:var(--warn-bg); color:var(--warn); }
.tabs { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:3px; background:var(--seg-bg); border-radius:11px; padding:4px; margin-bottom:20px; }
.tabs button { border:0; background:transparent; color:var(--muted); font-size:15px; font-weight:550; min-height:38px; border-radius:8px; padding:6px 10px; cursor:pointer; line-height:1.2; }
.tabs button:hover { color:var(--ink); }
.tabs button.on { background:var(--surface); color:var(--ink); font-weight:650; box-shadow:0 2px 6px rgba(40,65,30,.08); }
@media (max-width:640px){ .tabs { grid-auto-flow:row; grid-template-columns:1fr 1fr; } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:22px; margin-bottom:18px; min-width:0; }
.card h2 { font-size:18px; font-weight:650; letter-spacing:-0.03em; margin:0 0 14px; }
.hero { background:var(--hero-bg); color:var(--hero-ink); border-radius:24px; padding:28px; margin-bottom:18px; position:relative; overflow:hidden; }
.hero::before, .hero::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(173,203,155,.08); pointer-events:none; }
.hero::before { width:360px; height:360px; top:-190px; right:-80px; }
.hero::after { width:480px; height:480px; top:-250px; right:-140px; }
.hero > * { position:relative; z-index:1; }
.hero .k { color:var(--hero-muted); font-size:15px; }
.hero .v { font-size:clamp(26px,3.6vw,38px); font-weight:500; letter-spacing:-0.04em; line-height:1.1; font-variant-numeric:tabular-nums; }
.hero .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px 24px; }
.hero .good { color:var(--lime); }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:right; padding:12px 8px; border-bottom:1px solid var(--line); font-size:15.5px; vertical-align:middle; }
th:first-child, td:first-child { text-align:left; }
th { color:var(--muted); font-size:14px; font-weight:500; }
tr.total td { font-weight:650; border-bottom:0; }
tr.best td { background:var(--pos-soft); }
.goalseg { display:grid; grid-template-columns:1fr 1fr; gap:3px; background:var(--seg-bg); border-radius:11px; padding:4px; margin-bottom:16px; }
.goalseg button { border:0; background:transparent; color:var(--muted); border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; display:grid; gap:2px; }
.goalseg button b { font-size:15px; font-weight:600; }
.goalseg button small { font-size:13.5px; }
.goalseg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 2px 6px rgba(40,65,30,.08); }
.goalseg button[aria-pressed="true"] small { color:var(--muted); }
@media (max-width:640px){ .goalseg { grid-template-columns:1fr; } }
details.more summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; font-size:18px; font-weight:650; letter-spacing:-0.03em; }
details.more summary::-webkit-details-marker { display:none; }
details.more summary::after { content:'+'; font-size:22px; font-weight:400; color:var(--muted); }
details.more[open] summary::after { content:'−'; }
details.more .in { padding-top:16px; }
.table-scroll { overflow-x:auto; }
th.grp { text-align:center; border-bottom:2px solid var(--line-strong); color:var(--ink); font-weight:600; }
.card table input { min-width:104px; height:40px; padding:0 10px; font-size:15.5px; }
#calcWrap iframe { width:100%; height:calc(100vh - 190px); min-height:680px; border:1px solid var(--line); border-radius:24px; background:var(--bg); display:block; }
input[type=text], input[type=date], input[type=month], input[type=number], select {
  width:100%; min-width:110px; height:46px; border:1px solid var(--line); background:var(--field); color:var(--ink);
  border-radius:12px; padding:0 12px; font:inherit; font-size:17px; font-weight:500; font-variant-numeric:tabular-nums; text-align:right;
  transition:border-color .15s, box-shadow .15s; }
input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
input::placeholder { color:var(--muted); font-weight:400; opacity:.8; }
select { text-align:left; }
input.l { text-align:left; }
button:focus-visible { outline:3px solid #88B85B; outline-offset:3px; }
label.f { display:block; font-size:14px; font-weight:500; color:var(--muted); margin-bottom:14px; }
label.f input, label.f select { margin-top:0; }
.grid2 > label.f { display:flex; flex-direction:column; justify-content:space-between; gap:8px; margin:0; }
.grid2 + .grid2, .grid2 + .note { margin-top:16px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
.row > * { flex:0 0 auto; }
.row input { width:170px; }
button.btn, label.btn { display:inline-flex; align-items:center; height:46px; border:0; border-radius:12px; background:var(--hero-bg); color:#E7F2DF; font-weight:600; font-size:15.5px; padding:0 16px; cursor:pointer; }
button.btn:hover, label.btn:hover { filter:brightness(1.15); }
button.btn.primary { background:var(--brand); color:var(--brand-ink); }
button.btn.danger { background:transparent; color:var(--bad); border:1px solid var(--line-strong); }
button.btn.small { height:auto; padding:6px 10px; font-size:14px; border-radius:7px; background:transparent; color:var(--quick-ink); border:1px solid var(--quick-line); font-weight:550; }
button.btn.small:hover { background:var(--brand-soft); }
button.btn.small.danger { color:var(--bad); border-color:var(--line-strong); }
.note { font-size:15px; color:var(--muted); margin-top:12px; line-height:1.6; }
.alert { background:var(--warn-bg); color:var(--warn); border-radius:14px; padding:12px 16px; margin-bottom:14px; font-size:15.5px; }
.alert.bad { background:var(--bad-bg); color:var(--bad); }
.alert.ok { background:var(--pos-soft); color:var(--pos); border:1px solid var(--pos-line); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
.loan { border:1px solid var(--line); background:var(--field); border-radius:18px; padding:16px; }
.loan h3 { margin:0 0 8px; font-size:16px; font-weight:650; letter-spacing:-0.01em; }
.bar { height:6px; border-radius:4px; background:var(--line); overflow:hidden; margin:8px 0 12px; }
.bar > i { display:block; height:100%; background:var(--c-new); border-radius:4px; }
.kv { display:flex; justify-content:space-between; gap:10px; font-size:15px; padding:3px 0; font-variant-numeric:tabular-nums; }
.kv span:first-child { color:var(--muted); }
.pos { color:var(--pos); } .neg { color:var(--bad); }
.chart svg { width:100%; height:auto; display:block; }
.ax { fill:var(--muted); font-size:13px; font-family:var(--font); font-variant-numeric:tabular-nums; }
.legend { display:flex; gap:6px 18px; font-size:14px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
.legend i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; }
@media (max-width:640px){
  th, td { padding:9px 5px; font-size:14px; }
  body { padding:0 12px 32px; }
  .top { height:58px; } .brand { font-size:16px; } .mark { width:32px; height:32px; }
  #storage, .hello { display:none; }
  .theme-btn { padding:7px 10px; font-size:0; gap:0; } .theme-btn svg { width:17px; height:17px; }
  .tabs { position:sticky; top:0; z-index:5; display:flex; overflow-x:auto; scrollbar-width:none; margin:10px -12px 14px; border-radius:0; padding:6px 12px; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:0 0 auto; padding:8px 14px; }
  .card, .hero { border-radius:20px; padding:16px; margin-bottom:12px; }
  .hero .grid { grid-template-columns:1fr 1fr; gap:14px; } .hero .grid > div:first-child { grid-column:1 / -1; }
  .hero .v { font-size:26px; }
  .card h2 { font-size:17px; }
  table.stack thead { display:none; }
  table.stack tr { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; padding:12px 0; border-bottom:1px solid var(--line); }
  table.stack tbody tr:last-child { border-bottom:0; }
  table.stack td { display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:3px; border:0; padding:0; text-align:left; font-size:15px; min-width:0; }
  table.stack td::before { content:attr(data-h); font-size:12.5px; color:var(--muted); font-weight:400; }
  table.stack td[data-h=""]::before { display:none; }
  table.stack td:first-child { grid-column:1 / -1; font-weight:600; }
  table.stack td:first-child::before { display:none; }
  table.stack td input, table.stack td select, .card table.stack input { min-width:0; width:100%; }
  .row input, .row label.f { width:100%; }
  .row > .btn { flex:1 1 auto; justify-content:center; }
  #calcWrap iframe { height:calc(100vh - 120px); min-height:560px; border-radius:16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h4v4h4v4h4v4h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Кредитный трекер</span>
    </div>
    <div class="head-right">
      <div id="storage" class="badge">данные сохраняются в браузере</div>
      <button type="button" class="theme-btn" id="themeBtn" aria-pressed="false">
        <svg class="i-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <svg class="i-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="themeLbl">Тёмная тема</span>
      </button>
    </div>
  </header>
  <section class="hello">
    <p class="eyebrow">Кредиты · досрочное погашение</p>
    <h1>Быстрее и дешевле <span>закрыть долги.</span></h1>
    <div class="sub">Введите кредиты и сколько можете отдавать в месяц — трекер подберёт лучший план и каждый месяц подскажет, куда вносить.</div>
  </section>
  <nav class="tabs" id="tabs">
    <button data-tab="plan">План</button>
    <button data-tab="pay">Внести платёж</button>
    <button data-tab="slice">Срез на дату</button>
    <button data-tab="calc">Калькулятор</button>
    <button data-tab="set">Исходные данные</button>
  </nav>
  <main id="view"></main>
  <div id="calcWrap" hidden><iframe id="calcFrame" title="Калькулятор досрочного погашения" src="about:blank"></iframe></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
//#engine-start
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_FULL = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
let DISPLAY = ['C2','C1','Auto','Mort'];          // порядок показа (обновляется по списку кредитов)
let START = { y: 2026, mo: 9 };                      // месяц последнего платежа, от которого ведётся учёт (mo с нуля); m=0 — следующий платёж
let PAYDAY = 28;                                     // день платежа
const DAY = 86400000;

// месяц последнего прошедшего платежа (для нового трекера)
function defaultStart() { const n = new Date(), d = n.getDate() >= 28 ? n : new Date(n.getFullYear(), n.getMonth() - 1, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
const DEFAULTS = {
  settings: { budget: 0, bonus: 0, bonusMonth: 12, compOn: false, compEnd: '2029-03-31', compLimit: 0, compFirst: 0, goal: 'free',
              order: [], orderMode: 'auto', startMonth: defaultStart(), payDay: 28, slice: '2029-03-31' },
  loans: {},
  log: {}
};

// Очередь досрочных. Порядок — по ставке (авто) или ваш (вручную). Пока работодатель возмещает проценты по кредиту (comp),
// досрочно по нему платить невыгодно, и он уходит в конец очереди; когда компенсация кончилась — встаёт по обычным правилам.
function baseOrder(S) {
  const ids = Object.keys(S.loans), o = (S.settings.order || []).filter(k => ids.includes(k));
  ids.forEach(k => { if (!o.includes(k)) o.push(k); });
  return S.settings.orderMode === 'auto' ? o.slice().sort((x, y) => S.loans[y].rate - S.loans[x].rate) : o;
}
function orderFor(S, o, compActive) { return compActive ? o.filter(k => !S.loans[k].comp).concat(o.filter(k => S.loans[k].comp)) : o; }
function prepayOrder(S, compActive) { return orderFor(S, baseOrder(S), compActive !== false); }
// дата платежа m; m=-1 — последний платёж до начала учёта
function dt(m) {
  const t = START.mo + m, y = START.y + Math.floor(t / 12), mo = ((t % 12) + 12) % 12;
  return Date.UTC(y, mo, Math.min(PAYDAY, new Date(Date.UTC(y, mo + 1, 0)).getUTCDate()));
}
function baseLabel() { const d = new Date(dt(-1)); return String(d.getUTCDate()).padStart(2, '0') + '.' + String(d.getUTCMonth() + 1).padStart(2, '0') + '.' + d.getUTCFullYear(); }
function startM(L) { return L.start ? Math.max(0, mOfKey(L.start)) : 0; }          // с какого платежа кредит участвует в расчёте
function keyOf(m) { const d = new Date(dt(m)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function mOfKey(k) { const [y, mo] = k.split('-').map(Number); return (y - START.y) * 12 + (mo - 1 - START.mo); }
const MONTHS_N = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function label(m) { const d = new Date(dt(m)); return MONTHS_N[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function labelFull(m) { const d = new Date(dt(m)); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function isoMs(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
// доля года по дням (365/366), как считает банк
function yf(a, b) {
  let f = 0, cur = a;
  while (cur < b) {
    const y = new Date(cur).getUTCFullYear();
    const seg = Math.min(b, Date.UTC(y + 1, 0, 1));
    const diy = ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
    f += Math.round((seg - cur) / DAY) / diy;
    cur = seg;
  }
  return f;
}

      <button class="btn small" data-slice="${new Date().toISOString().slice(0, 10)}">Сегодня</button></div>
    ${isForecast ? '<div class="alert">В срез входят месяцы, которые вы ещё не отметили: по ним учтены только платежи по графику, без новых досрочных.</div>' : '<div class="alert ok">Срез целиком по отмеченным вами месяцам.</div>'}
    <div class="note" style="margin:0 0 8px">Последний платёж до этой даты: ${m >= 0 ? labelFull(m) : 'ещё не было'} (остаток после платежа и досрочных).</div>
    <div class="table-scroll"><table><thead><tr><th>Кредит</th><th>Остаток по трекеру</th><th>Без досрочных</th><th>Разница</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note">Компенсация работодателя к этой дате получена: ${money(compGot)}, остаток лимита: ${money(compLeft)}${S.settings.compOn ? '' : ' (компенсация выключена в настройках)'}.</div>
  </section>
  ${after}
  <section class="card"><h2>Когда закроются кредиты</h2>
    <div class="table-scroll"><table><thead><tr><th>Кредит</th><th>С учётом внесённых</th><th>Без досрочных</th></tr></thead><tbody>${ends}</tbody></table></div></section>
  <section class="card"><h2>Общий долг и дата среза</h2>${chartSVG(c, m, dd)}</section>`;
}

// ---------- вкладка «Настройки» ----------
function renderSet() {
  const st = S.settings;
  const lrows = DISPLAY.map(k => { const L = S.loans[k]; return `<tr><td><input class="l" type="text" data-l="${k}" data-f="name" value="${esc(L.name)}"></td>
    <td><input type="text" inputmode="decimal" data-l="${k}" data-f="rate" value="${L.rate}"></td>
    <td><input type="text" inputmode="decimal" data-l="${k}" data-f="pay" value="${moneyIn(L.pay)}"></td>
    <td><input type="text" inputmode="decimal" data-l="${k}" data-f="bal0" value="${moneyIn(L.bal0)}"></td>
    <td><select data-l="${k}" data-f="comp"><option value="0" ${!L.comp ? 'selected' : ''}>нет</option><option value="1" ${L.comp ? 'selected' : ''}>да</option></select></td>
    <td><button class="btn small danger" data-act="delloan" data-id="${k}">Удалить</button></td></tr>`; }).join('');
  const minsNow = DISPLAY.reduce((q, k) => q + (S.loans[k].bal0 > 0.5 ? S.loans[k].pay : 0), 0), compNow = st.compOn && DISPLAY.some(k => S.loans[k].comp) ? st.compFirst : 0;
  const monthSel = MONTHS_FULL.map((n, i) => `<option value="${i + 1}" ${st.bonusMonth === i + 1 ? 'selected' : ''}>${n}</option>`).join('');
  return `
  <section class="card"><h2>Кредиты</h2>
    <div class="table-scroll"><table><thead><tr><th>Название</th><th>Ставка, %</th><th>Платёж в месяц, ₽</th><th>Основной долг на ${baseLabel()}, ₽</th><th>Проценты возмещает работодатель</th><th></th></tr></thead><tbody>${lrows}</tbody></table></div>
    <div class="row"><button class="btn" id="btnAddLoan">+ Добавить кредит</button></div>
    <div class="note">Основной долг на ${baseLabel()} — это остаток после последнего платежа до начала учёта, без накопленных процентов. Если кредит оформлен позже — укажите сумму кредита и месяц первого платежа в блоке «Дата начала учёта». Менять числа у существующих нужно, только если банк пересчитал график. Удаление кредита стирает и его отметки в истории.</div></section>
  <section class="card"><h2>Сколько можете отдавать на кредиты</h2>
    <div class="grid2">
      <label class="f">Своих денег в месяц на кредиты, включая платежи по графику, ₽<input type="text" inputmode="decimal" data-s="budget" value="${moneyIn(st.budget)}"></label>
      <label class="f">Премия или другой доход раз в год, ₽<input type="text" inputmode="decimal" data-s="bonus" value="${moneyIn(st.bonus)}"></label>
      <label class="f">Месяц премии<select data-s="bonusMonth">${monthSel}</select></label>
    </div>
    <div class="note">Платежи по графику сейчас: ${money(minsNow)}.${compNow > 0 ? ' Компенсация работодателя добавляется сама (сейчас ' + money(compNow) + ').' : ''} ${st.budget + compNow > minsNow ? 'На досрочное остаётся около ' + money(st.budget + compNow - minsNow) + ' в месяц.' : '<b>Этой суммы не хватает на платежи по графику — досрочных не будет.</b>'}</div></section>
  <section class="card"><details class="more" id="dAcc" ${ui.det.dAcc ? 'open' : ''}><summary>Дата начала учёта и день платежа</summary><div class="in">
    <div class="grid2">
      <label class="f">Месяц последнего платежа, от которого ведётся учёт<input type="month" data-s="startMonth" value="${esc(st.startMonth)}"></label>
      <label class="f">День платежа в месяце<input type="text" inputmode="numeric" data-s="payDay" value="${st.payDay}"></label>
    </div>
    <div class="note">Остатки кредитов в таблице выше — на дату последнего платежа этого месяца. Отметки по месяцам хранятся по календарным месяцам и при смене этих настроек не пропадают.</div>
    <div class="grid2" style="margin-top:14px">${DISPLAY.map(k => `<label class="f">${esc(S.loans[k].name)}: первый платёж (если кредит новый)<input type="month" data-l="${k}" data-f="start" value="${esc(S.loans[k].start || '')}"></label>`).join('')}</div></div></details></section>
  <section class="card"><details class="more" id="dComp" ${ui.det.dComp ? 'open' : ''}><summary>Компенсация процентов работодателем</summary><div class="in">
    <div class="grid2">
      <label class="f">Учитывать компенсацию<select data-s="compOn"><option value="1" ${st.compOn ? 'selected' : ''}>да</option><option value="0" ${!st.compOn ? 'selected' : ''}>нет</option></select></label>
      <label class="f">Последняя выплата (дата)<input class="l" type="date" data-s="compEnd" value="${st.compEnd}"></label>
      <label class="f">Остаток лимита компенсации в первый месяц учёта, ₽<input type="text" inputmode="decimal" data-s="compLimit" value="${moneyIn(st.compLimit)}"></label>
      <label class="f">Компенсация в ближайшей зарплате, ₽<input type="text" inputmode="decimal" data-s="compFirst" value="${moneyIn(st.compFirst)}"></label>
    </div>
    <div class="note">Компенсация = проценты по отмеченным кредитам за прошлый месяц, пока не кончится лимит или дата. Она добавляется к сумме на кредиты.</div></div></details></section>
  <section class="card"><h2>Файл данных</h2>
    <div class="row" style="margin-top:0"><button class="btn" id="btnExport">Сохранить копию в файл</button>
      <label class="btn" style="margin:0">Загрузить копию<input type="file" id="fileImport" accept=".json,application/json" style="display:none"></label>
      <button class="btn danger" id="btnBlank">Очистить всё</button></div>
    ${appInfo && appInfo.telegram ? `<div class="note">Данные хранятся в облаке Telegram и одинаковы на телефоне и компьютере. Перенести данные из программы на ПК: там «Сохранить копию в файл», здесь — «Загрузить копию».</div>`
    : appInfo && appInfo.android ? `<div class="note">Данные хранятся в приложении на телефоне (копии по дням — последние 60). Чтобы перенести данные с компьютера: там «Сохранить копию в файл», перешлите файл на телефон и здесь нажмите «Загрузить копию».</div>`
    : appInfo ? `<div class="row"><button class="btn" id="btnOpenDir">Открыть папку с данными</button><button class="btn" id="btnChooseDir">Выбрать другую папку</button></div>
      <div class="note">Данные лежат в файле <b>${esc(appInfo.file)}</b>. Копии по дням (последние 60) — в подпапке backups. Если в новой папке уже есть данные трекера, возьмутся они, если нет — перенесутся текущие.</div>`
    : `<div class="note">Данные хранятся в браузере на этом компьютере. Если очистите данные сайтов или откроете файл другим браузером, их не будет видно, поэтому раз в месяц сохраняйте копию в файл.</div>`}</section>`;
}

// ---------- события ----------
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  const isCalc = ui.tab === 'calc';                      // калькулятор живёт в своём окне-вкладке и не сбрасывается при переключении
  $('#view').hidden = isCalc; $('#calcWrap').hidden = !isCalc;
  if (isCalc) { const f = $('#calcFrame'); if (!f.dataset.loaded) { f.dataset.loaded = '1'; f.src = 'calculator.html'; } return; }
  const v = $('#view');
  v.innerHTML = ui.tab === 'set' ? renderSet() : !hasDebt() ? emptyCard() : ui.tab === 'pay' ? renderPay() : ui.tab === 'slice' ? renderSlice() : renderPlan();
  labelTables(v);
}
// На узком экране таблицы показываются карточками: каждой ячейке нужна подпись из заголовка столбца
function labelTables(root) {
  root.querySelectorAll('table').forEach(tb => {
    const head = tb.tHead; if (!head) return;
    const grid = [];
    [...head.rows].forEach((row, ri) => { grid[ri] = grid[ri] || []; let c = 0;
      [...row.cells].forEach(cell => { while (grid[ri][c]) c++; const cs = cell.colSpan || 1, rs = cell.rowSpan || 1;
        for (let r = 0; r < rs; r++) for (let k = 0; k < cs; k++) { grid[ri + r] = grid[ri + r] || []; grid[ri + r][c + k] = cell; } c += cs; }); });
    const labels = (grid[grid.length - 1] || []).map(cell => cell ? cell.textContent.trim() : '');
    [...tb.tBodies].forEach(b => [...b.rows].forEach(tr => { let c = 0; [...tr.cells].forEach(td => { if (!td.dataset.h) td.dataset.h = labels[c] || ''; c += td.colSpan || 1; }); }));
    tb.classList.add('stack');
  });
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) { ui.tab = b.dataset.tab; render(); } });
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, label.btn'); if (!t) return;
  if (t.id === 'btnSave') { S.log[keyOf(ui.month)] = readMonthForm(); save(); render(); return; }
  if (t.id === 'btnClear') { delete S.log[keyOf(ui.month)]; save(); render(); return; }
  if (t.id === 'btnPlan') {
    const rec = ctx(true).sim.months[ui.month]; if (!rec) return;
    DISPLAY.forEach(k => { ['#ei_', '#ep_'].forEach(p => { const x = $(p + k); if (x && !x.disabled) x.value = ''; }); });
    DISPLAY.forEach(k => { const i = $('#ex_' + k); if (i && !i.disabled) i.value = rec.loans[k].extra > 0.5 ? moneyIn(Math.round(rec.loans[k].extra * 100) / 100) : ''; });
    return;
  }
  if (t.id === 'btnDist') {
    const rec = ctx(true).sim.months[ui.month]; let left = parseNum($('#distTotal').value) || 0; if (!rec) return;
    DISPLAY.forEach(k => { ['#ex_', '#ei_', '#ep_'].forEach(p => { const x = $(p + k); if (x && !x.disabled) x.value = ''; }); });
    const P = buildPlan(), pr = primaryAt(P, P.sim, ui.month);
    for (const k of (pr ? [pr] : []).concat(orderFor(S, P.order, rec.comp > 0.005).filter(x => x !== pr))) {
      const i = $('#ex_' + k); if (!i || i.disabled || left <= 0) continue;
      const a = Math.min(left, rec.loans[k].afterPay); if (a > 0) { i.value = moneyIn(Math.round(a * 100) / 100); left -= a; }
    }
    return;
  }
  if (t.dataset.act === 'edit') { ui.month = Number(t.dataset.m); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.goto) { ui.tab = t.dataset.goto; if (t.dataset.m) ui.month = Number(t.dataset.m); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.goal) { S.settings.goal = t.dataset.goal === 'save' ? 'save' : 'free'; save(); render(); return; }
  if (t.id === 'btnFollow' || t.id === 'btnFollow2') {      // отметить месяц по плану (+ сумма сверх плана)
    const m = Number(t.dataset.m), r = buildPlan().sim.months[m]; if (!r) return;
    const e = { extra: {}, done: true };
    DISPLAY.forEach(k => { const v = r.loans[k].extra; if (v > 0.5) e.extra[k] = Math.round(v * 100) / 100; });
    if (t.dataset.add) t.dataset.add.split(';').forEach(pr => { const [k, v] = pr.split(':'); e.extra[k] = Math.round(((e.extra[k] || 0) + Number(v)) * 100) / 100; });
    S.log[keyOf(m)] = e; ui.extra = 0; save();
    const tot = Object.values(e.extra).reduce((q, v) => q + v, 0);
    ui.flash = `Отмечено: ${labelFull(m)}${tot > 0.5 ? ', досрочно ' + money(tot) : ''}. Точный остаток из банка можно вписать во вкладке «Внести платёж».`;
    render(); window.scrollTo(0, 0); return;
  }
  if (t.dataset.act === 'applyorder') { S.settings.orderMode = 'manual'; S.settings.order = t.dataset.ord.split(',').filter(k => S.loans[k]); syncIds(S); save(); render(); return; }
  if (t.id === 'btnBlank') {
    if (!confirm('Удалить все кредиты, отметки и настройки? Сначала можно сохранить копию в файл.')) return;
    S = clone(DEFAULTS); S.loans = {}; S.log = {};
    S.settings.startMonth = defaultStart();
    syncIds(S); ui.month = null; save(); render(); return;
  }
  if (t.id === 'btnAddLoan') {
    const id = 'L' + Date.now().toString(36); S.loans[id] = { name: 'Новый кредит', rate: 15, pay: 0, bal0: 0, comp: false, start: '' };
    syncIds(S); save(); render(); return;
  }
  if (t.dataset.act === 'delloan') {
    const id = t.dataset.id;
    if (!confirm('Удалить кредит «' + S.loans[id].name + '»? Его отметки в истории тоже удалятся.')) return;
    delete S.loans[id];
    Object.keys(S.log).forEach(k => { const e = S.log[k]; ['extra', 'sync', 'split', 'xsplit'].forEach(f => { if (e && e[f]) delete e[f][id]; }); });
    syncIds(S); save(); render(); return;
  }
  if (t.dataset.act === 'del') { delete S.log[keyOf(Number(t.dataset.m))]; save(); render(); return; }
  if (t.dataset.slice) { S.settings.slice = t.dataset.slice; save(); render(); return; }
  if (t.id === 'btnExport') {
    const name = 'kredit-tracker-' + new Date().toISOString().slice(0, 10) + '.json';
    if (window.AndroidStore) { const r = window.AndroidStore.exportFile(name, JSON.stringify(S, null, 2)); alert(r ? 'Копия сохранена в «Загрузки»: ' + r : 'Не удалось сохранить копию.'); return; }
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'kredit-tracker-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
  }
  if (t.id === 'btnOpenDir') { window.trackerStore.openFolder(); return; }
  if (t.id === 'btnChooseDir') {
    window.trackerStore.chooseFolder().then(r => {
      if (!r) return;
      let s2 = null; try { s2 = r.text ? JSON.parse(r.text) : null; } catch (e) { alert('В выбранной папке файл данных не читается.'); return; }
      appInfo = { file: r.file, dir: r.dir }; if (s2) S = merge(clone(DEFAULTS), s2); loadFailed = false; save(); render();
    });
    return;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'selMonth') { ui.month = Number(t.value); render(); return; }
  if (t.id === 'extraAmt') { updateExtra(); return; }
  if (t.id === 'sliceDate') { if (t.value) { S.settings.slice = t.value; save(); render(); } return; }
  if (t.id === 'fileImport') {
    const f = t.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); if (!j.loans || !j.settings) throw 0; S = merge(clone(DEFAULTS), j); save(); render(); } catch (err) { alert('Не удалось прочитать файл: это не копия трекера.'); } };
    r.readAsText(f); return;
  }
  if (t.dataset.l) {
    const L = S.loans[t.dataset.l], f = t.dataset.f;
    if (f === 'name') L.name = t.value.trim() || L.name;
    else if (f === 'comp') L.comp = t.value === '1';
    else if (f === 'start') L.start = t.value || '';
    else { const n = parseNum(t.value); if (n !== null && n >= 0) L[f] = n; }
    save(); render(); return;
  }
  if (t.dataset.ord !== undefined) {
    const i = Number(t.dataset.ord), v = t.value, o = prepayOrder(S).filter(k => !S.loans[k].comp), j = o.indexOf(v);
    if (j >= 0) o[j] = o[i]; o[i] = v; S.settings.order = o.concat(prepayOrder(S).filter(k => S.loans[k].comp)); syncIds(S); save(); render(); return;
  }
  if (t.dataset.s) {
    const f = t.dataset.s;
    if (f === 'compOn') S.settings.compOn = t.value === '1';
    else if (f === 'compEnd') { if (t.value) S.settings.compEnd = t.value; }
    else if (f === 'bonusMonth') S.settings.bonusMonth = Number(t.value);
    else if (f === 'goal') S.settings.goal = t.value === 'save' ? 'save' : 'free';
    else if (f === 'startMonth') { if (/^\d{4}-\d{2}$/.test(t.value)) S.settings.startMonth = t.value; }
    else if (f === 'orderMode') { if (t.value === 'manual') S.settings.order = baseOrder(S); S.settings.orderMode = t.value; }
    else if (f === 'payDay') { const n = Math.round(parseNum(t.value)); if (n >= 1 && n <= 31) S.settings.payDay = n; }
    else { const n = parseNum(t.value); if (n !== null && n >= 0) S.settings[f] = n; }
    syncIds(S); save(); render();
  }
});

load().then(() => {
  if (loadFailed) { badge('warn', 'файл данных не прочитан — запись отключена'); alert('Не удалось прочитать файл данных трекера. Запись отключена, чтобы не затереть его. Копии по дням лежат в подпапке backups рядом с файлом данных.'); }
  else if (window.trackerStore) badge('ok', appInfo && appInfo.telegram ? 'данные в облаке Telegram' : 'данные в файле');
  else save();
  render();
});
</script>
</body>
</html>
